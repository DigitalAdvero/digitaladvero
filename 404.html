<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stranica nije pronađena — DigitalAdvero</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050912">
<style>
  /* Self-contained on purpose: this page can be served from any depth, so it uses no relative assets. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; color: #f2f5fb;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background:
      radial-gradient(60% 50% at 15% 0%, rgba(58,108,255,.34), transparent 70%),
      radial-gradient(50% 45% at 90% 100%, rgba(126,96,255,.28), transparent 70%), #050912;
  }
  .code { font-size: clamp(5rem, 22vw, 10rem); font-weight: 700; line-height: 1; letter-spacing: -.04em;
    background: linear-gradient(100deg, #9dc3ff, #5b93ff 45%, #8f7cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { margin: .4rem 0 .6rem; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 600; }
  p { margin: 0 auto 2rem; max-width: 42ch; color: #8e99b0; line-height: 1.6; }
  a { display: inline-block; padding: .9rem 1.6rem; border-radius: 10px; color: #fff; font-weight: 600; text-decoration: none;
    background: linear-gradient(135deg, #3565f5, #6a4ff0); box-shadow: 0 12px 32px -12px rgba(76,112,255,.75); }
  a:focus-visible { outline: 2px solid #9dc3ff; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>Ova stranica ne postoji</h1>
    <p>Možda je adresa pogrešno upisana ili je stranica premještena. Vratite se na početnu i nastavite odatle.</p>
    <a href="./">Nazad na DigitalAdvero</a>
  </main>
</body>
</html>
